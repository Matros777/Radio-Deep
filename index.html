        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {

            font-family: 'Arial', sans-serif;

            z-index: 0;

            display: block;
        }

        /* Лёгкое затемнение поверх фона для читаемости */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(3,4,10,0.7) 100%);
        }

        /* === НЕОНОВЫЙ СТЕКЛЯННЫЙ КОНТЕЙНЕР === */
        .container {
            position: relative;
            z-index: 2;
            background: rgba(8, 10, 22, 0.45);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,255,204,0.25), 0 0 80px rgba(255,0,255,0.15), inset 0 0 30px rgba(0,255,255,0.05);
            width: 100%;
            max-width: 940px;
            text-align: center;
            border: 1px solid rgba(0,255,204,0.55);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* === АНИМИРОВАННЫЙ НЕОНОВЫЙ ЗАГОЛОВОК === */
        .neon-title {
            font-size: 3.2em;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00ffcc, #ff00ff, #4d7cff, #00ffcc);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neonFlow 6s linear infinite, titleFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(0,255,204,0.7)) drop-shadow(0 0 24px rgba(255,0,255,0.4));
        }
        @keyframes neonFlow {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        .subtext {
            font-size: 0.95em;
            color: #cfd9ea;
            text-shadow: 0 0 8px rgba(0,255,204,0.5);
        }

        /* === ЭКВАЛАЙЗЕР (видеоряд-волны) === */
        .equalizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
            height: 46px;
            margin: 6px 0;
        }
        .eq-bar {
            width: 6px;
            border-radius: 3px;
            background: linear-gradient(180deg, #00ffcc, #ff00ff, #4d7cff);
            box-shadow: 0 0 10px rgba(0,255,204,0.6);
            animation: eq 1.1s ease-in-out infinite;
        }
        .eq-bar:nth-child(1){ animation-duration: 1.0s; height: 20%; }
        .eq-bar:nth-child(2){ animation-duration: 0.8s; height: 60%; }
        .eq-bar:nth-child(3){ animation-duration: 1.2s; height: 35%; }
        .eq-bar:nth-child(4){ animation-duration: 0.6s; height: 80%; }
        .eq-bar:nth-child(5){ animation-duration: 0.9s; height: 50%; }
        .eq-bar:nth-child(6){ animation-duration: 1.0s; height: 70%; }
        .eq-bar:nth-child(7){ animation-duration: 0.7s; height: 30%; }
        .eq-bar:nth-child(8){ animation-duration: 1.1s; height: 90%; }
        .eq-bar:nth-child(9){ animation-duration: 0.8s; height: 45%; }
        .eq-bar:nth-child(10){ animation-duration: 1.3s; height: 65%; }
        .eq-bar:nth-child(11){ animation-duration: 0.9s; height: 25%; }
        .eq-bar:nth-child(12){ animation-duration: 1.0s; height: 75%; }
        @keyframes eq {
            0%, 100% { transform: scaleY(0.35); opacity: 0.7; }
            50%      { transform: scaleY(1);    opacity: 1; }
        }

    <script type="text/javascript">
        // === ЖИВОЙ ФОН: АВРОРА + ЧАСТИЦЫ + СЕТКА (видеоряд) ===
        (function () {
            var canvas = document.getElementById('bg');
            var ctx = canvas.getContext('2d');
            var w, h, raf;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // красочные "аврора" пятна, дрейфующие по фону
            var blobs = [
                { x: 0.2, y: 0.3, r: 0.5, hue: 175, spd: 0.00025, drift: 0.00013, omega: 0 },
                { x: 0.85, y: 0.25, r: 0.45, hue: 300, spd: 0.0002, drift: 0.0001, omega: 0 },
                { x: 0.5, y: 0.85, r: 0.5, hue: 230, spd: 0.00022, drift: -0.00012, omega: 0 },
                { x: 0.7, y: 0.5, r: 0.4, hue: 200, spd: 0.00018, drift: 0.00014, omega: 0 }
            ];

            // частицы
            var parts = [];
            for (var i = 0; i < 90; i++) {
                parts.push({
                    x: Math.random(), y: Math.random(),
                    r: Math.random() * 1.8 + 0.4,
                    vx: (Math.random() - 0.5) * 0.0004,
                    vy: -Math.random() * 0.0006 - 0.0001,
                    alpha: Math.random() * 0.6 + 0.15
                });
            }

            function draw(t) {
                // затемнённая подложка
                ctx.fillStyle = '#04050c';
                ctx.fillRect(0, 0, w, h);

                // аврора
                for (var i = 0; i < blobs.length; i++) {
                    var b = blobs[i];
                    b.omega += b.spd;
                    var bx = (b.x + Math.sin(b.omega) * b.drift) * w;
                    var by = (b.y + Math.cos(b.omega * 0.9) * b.drift) * h;
                    var br = b.r * Math.min(w, h) * (0.9 + Math.sin(t * 0.001 + i) * 0.1);
                    var g = ctx.createRadialGradient(bx, by, 0, bx, by, br);
                    g.addColorStop(0, 'hsla(' + b.hue + ', 100%, 55%, 0.30)');
                    g.addColorStop(1, 'hsla(' + b.hue + ', 100%, 50%, 0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(bx, by, br, 0, Math.PI * 2);
                    ctx.fill();
                }

                // тонкая неоновая сетка
                ctx.strokeStyle = 'hsla(180, 100%, 60%, 0.04)';
                ctx.lineWidth = 1;
                var step = 80;
                var ox = (t * 0.02) % step;
                ctx.beginPath();
                for (var x = -step; x < w + step; x += step) {
                    ctx.moveTo(x - ox, 0); ctx.lineTo(x - ox, h);
                }
                for (var y = 0; y < h; y += step) {
                    ctx.moveTo(0, y); ctx.lineTo(w, y);
                }
                ctx.stroke();

                // частицы
                for (var p = 0; p < parts.length; p++) {
                    var q = parts[p];
                    q.x += q.vx; q.y += q.vy;
                    if (q.y < -0.05) { q.y = 1.05; q.x = Math.random(); }
                    if (q.x < -0.05) q.x = 1.05;
                    if (q.x > 1.05) q.x = -0.05;
                    ctx.globalAlpha = q.alpha * (0.7 + Math.sin(t * 0.002 + p) * 0.3);
                    ctx.fillStyle = '#00ffcc';
                    ctx.beginPath();
                    ctx.arc(q.x * w, q.y * h, q.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                raf = requestAnimationFrame(draw);
            }
            raf = requestAnimationFrame(draw);
        })();
    </script>
