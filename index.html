    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }

        /* === ТЕМЫ: неоновая (по умолчанию) и космическая === */
        body.theme-neon {
            --bg-1: #04050c;
            --bg-2: #06091a;
            --container-bg: rgba(8, 10, 22, 0.45);
            --container-border: rgba(0, 255, 204, 0.55);
            --glow-a: 0, 255, 204;
            --glow-b: 255, 0, 255;
            --title-grad: linear-gradient(90deg, #00ffcc, #ff00ff, #4d7cff, #00ffcc);
            --text-hi: #e8eef7;
            --text-sub: #cfd9ea;
            --particle: #00ffcc;
            --shadow-hi: var(--glow-a);
        }
        body.theme-cosmic {
            --bg-1: #04040a;
            --bg-2: #050614;
            --container-bg: rgba(5, 6, 16, 0.55);
            --container-border: rgba(120, 140, 255, 0.55);
            --glow-a: 90, 120, 255;
            --glow-b: 180, 80, 255;
            --title-grad: linear-gradient(90deg, #9fb0ff, #c58aff, #4a6cff, #9fb0ff);
            --text-hi: #eef2ff;
            --text-sub: #b6c2ff;
            --particle: #aab9ff;
            --shadow-hi: var(--glow-a);
        }
        body.theme-light {
            --bg-1: #eef2fb;
            --bg-2: #ffffff;
            --container-bg: rgba(255, 255, 255, 0.6);
            --container-border: rgba(80, 120, 220, 0.35);
            --glow-a: 60, 110, 200;
            --glow-b: 140, 90, 220;
            --title-grad: linear-gradient(90deg, #3d7bd6, #9b4fdb, #3d7bd6);
            --text-hi: #20263a;
            --text-sub: #5a6784;
            --particle: #5b8fff;
            --shadow-hi: var(--glow-a);
        }
        /* 4-я тема: приглушённый белый (как светлая тема после обновления — чуть темнее) */
        body.theme-soft {
            --bg-1: #d9dde2;
            --bg-2: #e9ecef;
            --container-bg: rgba(235, 238, 241, 0.72);
            --container-border: rgba(110, 130, 150, 0.3);
            --glow-a: 70, 110, 140;
            --glow-b: 130, 120, 170;
            --title-grad: linear-gradient(90deg, #4a6a86, #7a6a9e, #4a6a86);
            --text-hi: #1e2630;
            --text-sub: #5c6874;
            --particle: #7c93a6;
            --shadow-hi: var(--glow-a);
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: var(--text-hi);
            background: radial-gradient(circle at 50% 0%, var(--bg-2), var(--bg-1) 70%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: background 0.6s ease, color 0.4s ease;
        }

        /* === ЖИВОЙ ВИДЕОРЯД-ФОН (canvas) === */
        #bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Лёгкое затемнение поверх фона для читаемости */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(2,3,8,0.75) 100%);
        }
        /* светлее виньетка для светлой темы */
        body.theme-light .vignette {
            background: radial-gradient(ellipse at center, rgba(255,255,255,0) 50%, rgba(240,245,255,0.5) 100%);
        }
        /* мягкая виньетка для приглушённой белой темы */
        body.theme-soft .vignette {
            background: radial-gradient(ellipse at center, rgba(255,255,255,0) 55%, rgba(228,232,234,0.4) 100%);
        }
        /* кнопка крутится на светлой теме с тёмной иконкой */
        body.theme-light .theme-toggle {
            border-color: rgba(80, 110, 200, 0.35);
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 20px rgba(60, 90, 180, 0.18), 0 0 20px rgba(var(--glow-a), 0.15);
        }
        /* кнопка для приглушённой белой темы */
        body.theme-soft .theme-toggle {
            border-color: rgba(110, 130, 150, 0.35);
            background: rgba(250, 251, 251, 0.7);
            box-shadow: 0 4px 20px rgba(90, 110, 130, 0.18), 0 0 20px rgba(var(--glow-a), 0.12);
        }

        /* === КОМПАКТНАЯ ШАПКА === */
        .site-header {
            position: relative;
            z-index: 5;
            flex-shrink: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px 16px;
            font-size: 0.72em;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-sub);
            text-shadow: 0 0 8px rgba(var(--glow-a), 0.4);
            background: linear-gradient(180deg, rgba(var(--glow-a), 0.06), transparent);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: color 0.4s ease;
        }
        .site-header .brand {
            font-weight: 800;
            font-size: 1.2em;
            color: var(--text-hi);
            text-decoration: none;
            text-shadow: 0 0 10px rgba(var(--glow-a), 0.7);
            background: var(--title-grad);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neonFlow 6s linear infinite;
        }
        .site-header .h-sub { opacity: 0.8; }

        /* === КОМПАКТНЫЙ ПОДВАЛ === */
        .site-footer {
            position: relative;
            z-index: 5;
            flex-shrink: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 8px 16px;
            font-size: 0.72em;
            color: var(--text-sub);
            text-shadow: 0 0 6px rgba(var(--glow-a), 0.4);
            background: linear-gradient(0deg, rgba(var(--glow-a), 0.06), transparent);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: color 0.4s ease;
        }
        .site-footer a {
            color: var(--text-sub);
            text-decoration: none;
            transition: color 0.3s;
        }
        .site-footer a:hover { color: var(--text-hi); }
        .f-sep { opacity: 0.4; }

        /* === ЭЛЕГАНТНАЯ КНОПКА ПЕРЕКЛЮЧЕНИЯ ТЕМ === */
        .theme-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 20;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px) saturate(140%);
            -webkit-backdrop-filter: blur(10px) saturate(140%);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35), 0 0 20px rgba(var(--glow-a), 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .theme-toggle:hover {
            transform: scale(1.08);
            border-color: rgba(var(--glow-a), 0.6);
            box-shadow: 0 4px 26px rgba(0, 0, 0, 0.4), 0 0 28px rgba(var(--glow-a), 0.45);
        }
        .theme-toggle:active { transform: scale(0.96); }
        .theme-toggle svg {
            width: 22px;
            height: 22px;
            display: block;
            transition: opacity 0.35s, transform 0.5s ease;
        }
        .theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg); }
        .theme-toggle .icon-moon { opacity: 0; transform: rotate(-90deg); position: absolute; }
        .theme-toggle .icon-spark { opacity: 0; transform: rotate(-90deg); position: absolute; }
        body.theme-cosmic .theme-toggle .icon-sun { opacity: 0; transform: rotate(90deg); }
        body.theme-cosmic .theme-toggle .icon-moon { opacity: 1; transform: rotate(0deg); }
        body.theme-cosmic .theme-toggle .icon-spark { opacity: 0; transform: rotate(90deg); }
        body.theme-light .theme-toggle .icon-sun { opacity: 0; transform: rotate(90deg); }
        body.theme-light .theme-toggle .icon-moon { opacity: 0; transform: rotate(90deg); }
        body.theme-light .theme-toggle .icon-spark { opacity: 1; transform: rotate(0deg); }
        body.theme-soft .theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg); }
        body.theme-soft .theme-toggle .icon-moon { opacity: 0; transform: rotate(-90deg); }
        body.theme-soft .theme-toggle .icon-spark { opacity: 0; transform: rotate(-90deg); }

        /* === НЕОНОВЫЙ СТЕКЛЯННЫЙ КОНТЕЙНЕР === */
        .container {
            position: relative;
            z-index: 2;
            background: var(--container-bg);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(var(--glow-a), 0.25), 0 0 80px rgba(var(--glow-b), 0.15), inset 0 0 30px rgba(var(--glow-a), 0.05);
            width: 100%;
            max-width: 940px;
            text-align: center;
            border: 1px solid var(--container-border);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: background 0.6s ease, border-color 0.6s ease, box-shadow 0.6s ease;
            /* чтобы шапка+подвал+контейнер умещались в экран без прокрутки страницы */
            max-height: calc(100vh - 96px);
            overflow-y: visible;
            margin-top: auto;
            margin-bottom: auto;
        }

        /* === АНИМИРОВАННЫЙ НЕОНОВЫЙ ЗАГОЛОВОК === */
        h1.neon-title {
            margin: 0;
            font-size: 3.2em;
            font-weight: 800;
            letter-spacing: 2px;
            background: var(--title-grad);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neonFlow 6s linear infinite, titleFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(var(--glow-a), 0.7)) drop-shadow(0 0 24px rgba(var(--glow-b), 0.4));
        }
        @keyframes neonFlow {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        h2.subtext {
            margin: 0;
            font-size: 0.95em;
            color: var(--text-sub);
            text-shadow: 0 0 8px rgba(var(--glow-a), 0.5);
            transition: color 0.4s ease;
        }

        /* === ЭКВАЛАЙЗЕР (видеоряд-волны) === */
        .equalizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
            height: 46px;
            margin: 6px 0;
        }
        .eq-bar {
            width: 6px;
            border-radius: 3px;
            background: linear-gradient(180deg, rgba(var(--glow-a),1), rgba(var(--glow-b),1));
            box-shadow: 0 0 10px rgba(var(--glow-a), 0.6);
            animation: eq 1.1s ease-in-out infinite;
            transition: background 0.5s ease;
        }
        .eq-bar:nth-child(1){ animation-duration: 1.0s; height: 20%; }
        .eq-bar:nth-child(2){ animation-duration: 0.8s; height: 60%; }
        .eq-bar:nth-child(3){ animation-duration: 1.2s; height: 35%; }
        .eq-bar:nth-child(4){ animation-duration: 0.6s; height: 80%; }
        .eq-bar:nth-child(5){ animation-duration: 0.9s; height: 50%; }
        .eq-bar:nth-child(6){ animation-duration: 1.0s; height: 70%; }
        .eq-bar:nth-child(7){ animation-duration: 0.7s; height: 30%; }
        .eq-bar:nth-child(8){ animation-duration: 1.1s; height: 90%; }
        .eq-bar:nth-child(9){ animation-duration: 0.8s; height: 45%; }
        .eq-bar:nth-child(10){ animation-duration: 1.3s; height: 65%; }
        .eq-bar:nth-child(11){ animation-duration: 0.9s; height: 25%; }
        .eq-bar:nth-child(12){ animation-duration: 1.0s; height: 75%; }
        @keyframes eq {
            0%, 100% { transform: scaleY(0.35); opacity: 0.7; }
            50%      { transform: scaleY(1);    opacity: 1; }
        }

        /* === ПЛЕЕР RADIOBELLS === */
        #radiobells_container {
            margin-top: 14px;
            background: rgba(6, 8, 18, 0.6);
            backdrop-filter: blur(8px);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(var(--glow-b), 0.45);
            width: 100%;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 20px rgba(var(--glow-b), 0.25), inset 0 0 12px rgba(var(--glow-b), 0.05);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }
        #RP_link {
            color: rgba(var(--glow-a),1);
            text-decoration: none;
            font-size: 1.25em;
            text-shadow: 0 0 6px rgba(var(--glow-a),1);
            transition: color 0.3s, text-shadow 0.3s;
        }
        #RP_link:hover {
            color: rgba(var(--glow-b),1);
            text-shadow: 0 0 8px rgba(var(--glow-b),1);
        }

        .footer-text {
            font-size: 0.8em;
            color: var(--text-sub);
            text-shadow: 0 0 6px rgba(var(--glow-a), 0.4);
            margin-top: 14px;
        }

        /* === АДАПТИВ (МОБИЛЬНЫЕ) === */
        @media (max-width: 768px) {
            body { overflow: hidden; height: 100vh; }
            .container {
                width: 100%;
                padding: 14px;
                /* опускаем контент ниже, чтобы плеер не был слишком высоко */
                padding-top: 52px;
                padding-bottom: 20px;
                margin: 0;
                height: calc(100vh - 78px);
                max-height: 100vh;
                overflow-y: visible;
                border-radius: 0;
                border-left: none;
                border-right: none;
                gap: 14px;
            }
            .site-header { padding: 6px 10px; font-size: 0.66em; }
            .site-footer { padding: 6px 10px; font-size: 0.66em; }
            h1.neon-title { font-size: 2em; }
            h2.subtext { font-size: 0.8em; }
            .equalizer { height: 30px; margin: 0; }
            #radiobells_container { width: 100%; max-width: none; padding: 6px; margin-top: 4px; }
            #RP_link { font-size: 1em; }
            .footer-text { font-size: 0.7em; margin-top: 6px; }
            .theme-toggle { top: 10px; right: 10px; width: 42px; height: 42px; }
        }

        /* === ТОНКИЙ ТЕМНЫЙ СКРОЛЛБАР СПИСКА СТАНЦИЙ === */
        #rad_list {
            scrollbar-width: thin !important;
            scrollbar-color: #555b6e transparent !important;
            -ms-overflow-style: auto !important;
        }
        #rad_list::-webkit-scrollbar { width: 6px !important; }
        #rad_list::-webkit-scrollbar-track { background: transparent !important; }
        #rad_list::-webkit-scrollbar-thumb {
            background: #4a5060 !important;
            border-radius: 6px !important;
            border: 2px solid transparent !important;
            background-clip: content-box !important;
        }
        #rad_list::-webkit-scrollbar-thumb:hover { background: #5c6373 !important; background-clip: content-box !important; }
    </style>

    <script type="text/javascript">
        // === ПЕРЕКЛЮЧЕНИЕ ТЕМЫ (неоновая / космическая / светлая) ===
        (function () {
            var btn = document.getElementById('themeToggle');
            var storeKey = 'radio-theme';
            var ORDER = ['neon', 'cosmic', 'light', 'soft'];
            function applyTheme(theme) {
                document.body.classList.remove('theme-neon', 'theme-cosmic', 'theme-light', 'theme-soft');
                document.body.classList.add('theme-' + theme);
                try { localStorage.setItem(storeKey, theme); } catch (e) {}
                if (window.__themeFn) window.__themeFn(theme);
            }
            // сохранённая тема
            var saved = null;
            try { saved = localStorage.getItem(storeKey); } catch (e) {}
            applyTheme(ORDER.indexOf(saved) >= 0 ? saved : 'neon');
            btn.addEventListener('click', function () {
                var cur = ORDER.indexOf(document.body.className.match(/theme-(\w+)/)[1]);
                applyTheme(ORDER[(cur + 1) % ORDER.length]);
            });
        })();
    </script>

    <script type="text/javascript">
        // === ЖИВОЙ ФОН: АВРОРА + ЧАСТИЦЫ + СЕТКА (видеоряд) ===
        (function () {
            var canvas = document.getElementById('bg');
            var ctx = canvas.getContext('2d');
            var w, h, raf;
            // стартуем с сохранённой темы, чтобы после обновления страницы
            // фон не оставался тёмным (раньше канвас всегда начинал с neon)
            var currentTheme = 'neon';
            try { currentTheme = localStorage.getItem('radio-theme') || 'neon'; } catch (e) {}

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // Конфиги авроры/частиц по темам
            var CONFIGS = {
                neon: {
                    blobs: [
                        { x: 0.2, y: 0.3, r: 0.5, hue: 175 }, { x: 0.85, y: 0.25, r: 0.45, hue: 300 },
                        { x: 0.5, y: 0.85, r: 0.5, hue: 230 }, { x: 0.7, y: 0.5, r: 0.4, hue: 200 }
                    ],
                    particle: '0, 255, 204',
                    starAlpha: 0.6
                },
                cosmic: {
                    blobs: [
                        { x: 0.2, y: 0.3, r: 0.5, hue: 220 }, { x: 0.85, y: 0.25, r: 0.45, hue: 280 },
                        { x: 0.5, y: 0.85, r: 0.5, hue: 250 }, { x: 0.7, y: 0.5, r: 0.4, hue: 210 }
                    ],
                    particle: '170, 185, 255',
                    starAlpha: 0.85
                },
                light: {
                    blobs: [
                        { x: 0.2, y: 0.3, r: 0.5, hue: 205 }, { x: 0.85, y: 0.25, r: 0.45, hue: 260 },
                        { x: 0.5, y: 0.85, r: 0.5, hue: 225 }, { x: 0.7, y: 0.5, r: 0.4, hue: 190 }
                    ],
                    particle: '91, 143, 255',
                    starAlpha: 0.5
                },
                soft: {
                    blobs: [
                        { x: 0.2, y: 0.3, r: 0.5, hue: 200 }, { x: 0.85, y: 0.25, r: 0.45, hue: 240 },
                        { x: 0.5, y: 0.85, r: 0.5, hue: 215 }, { x: 0.7, y: 0.5, r: 0.4, hue: 185 }
                    ],
                    particle: '124, 147, 166',
                    starAlpha: 0.35
                }
            };
            var config = CONFIGS[currentTheme];

            // Анимированные аврора-пятна
            var blobs = CONFIGS.neon.blobs.map(function (b) {
                return { x: b.x, y: b.y, r: b.r, hue: b.hue, spd: 0.00024, drift: 0.00012, omega: 0 };
            });

            // Частицы-«звёзды»
            var parts = [];
            for (var i = 0; i < 110; i++) {
                parts.push({
                    x: Math.random(), y: Math.random(),
                    r: Math.random() * 1.8 + 0.4,
                    vx: (Math.random() - 0.5) * 0.0004,
                    vy: -Math.random() * 0.0005 - 0.00008,
                    tw: Math.random() * Math.PI * 2
                });
            }

            function rebuild() {
                config = CONFIGS[currentTheme];
                for (var i = 0; i < blobs.length; i++) blobs[i].hue = config.blobs[i].hue;
            }
            // переключение темы из основного скрипта
            window.__themeFn = function (theme) {
                currentTheme = theme;
                rebuild();
            };

            function draw(t) {
                // фоновая подложка по теме
                var isLight = (currentTheme === 'light' || currentTheme === 'soft');
                ctx.fillStyle = currentTheme === 'light' ? '#f3f6ff' : (currentTheme === 'soft' ? '#e2e5e8' : '#04050c');
                ctx.fillRect(0, 0, w, h);

                // аврора
                for (var i = 0; i < blobs.length; i++) {
                    var b = blobs[i];
                    b.omega += b.spd;
                    var bx = (b.x + Math.sin(b.omega) * b.drift) * w;
                    var by = (b.y + Math.cos(b.omega * 0.9) * b.drift) * h;
                    var br = b.r * Math.min(w, h) * (0.9 + Math.sin(t * 0.001 + i) * 0.1);
                    var g = ctx.createRadialGradient(bx, by, 0, bx, by, br);
                    g.addColorStop(0, 'hsla(' + b.hue + ', 100%, 55%, 0.28)');
                    g.addColorStop(1, 'hsla(' + b.hue + ', 100%, 50%, 0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(bx, by, br, 0, Math.PI * 2);
                    ctx.fill();
                }

                // тонкая неоновая сетка
                var isLightT = (currentTheme === 'light' || currentTheme === 'soft');
                var gridHue = currentTheme === 'cosmic' ? 230 : (isLightT ? 215 : 180);
                ctx.strokeStyle = 'hsla(' + gridHue + ', 100%, ' + (isLightT ? '45%' : '60%') + ', ' + (isLightT ? '0.05' : '0.04') + ')';
                ctx.lineWidth = 1;
                var step = 80;
                var ox = (t * 0.02) % step;
                ctx.beginPath();
                for (var x = -step; x < w + step; x += step) {
                    ctx.moveTo(x - ox, 0); ctx.lineTo(x - ox, h);
                }
                for (var y = 0; y < h; y += step) {
                    ctx.moveTo(0, y); ctx.lineTo(w, y);
                }
                ctx.stroke();

                // частицы-звёзды
                for (var p = 0; p < parts.length; p++) {
                    var q = parts[p];
                    q.x += q.vx; q.y += q.vy;
                    if (q.y < -0.05) { q.y = 1.05; q.x = Math.random(); }
                    if (q.x < -0.05) q.x = 1.05;
                    if (q.x > 1.05) q.x = -0.05;
                    var twinkle = 0.7 + Math.sin(t * 0.002 + q.tw) * 0.3;
                    ctx.globalAlpha = config.starAlpha * twinkle;
                    ctx.fillStyle = 'rgb(' + config.particle + ')';
                    ctx.beginPath();
                    ctx.arc(q.x * w, q.y * h, q.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                raf = requestAnimationFrame(draw);
            }
            raf = requestAnimationFrame(draw);
        })();
    </script>
